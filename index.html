<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>白际乡 · 红绿交融 | 徽州天路</title>
    <!-- Leaflet 核心样式与脚本 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 引入思源宋体，更显大气 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap">
    <!-- 引入外部样式文件 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <div class="logo-area">
                <h1>白际 · 徽州天路</h1>
                <p>红绿交融 · 景美人和</p>
            </div>
            <div class="header-actions">
                <div class="specialties-mini">
                    <span><i class="fas fa-gift"></i> 山珍风味</span>
                    <i class="fas fa-seedling"></i> 红薯干 <i class="fas fa-leaf"></i> 笋干 <i class="fas fa-egg"></i> 土鸡蛋
                </div>
                <div class="user-actions">
                    <button id="loginBtn" class="btn-login"><i class="fas fa-user"></i> 登录/注册</button>
                    <div id="userInfo" class="user-info" style="display: none;">
                        <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
                        <div class="user-details">
                            <span id="userName" class="user-name">用户名</span>
                            <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <!-- 登录弹窗 -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>用户登录</h3>
                <span class="close-btn">&times;</span>
            </div>
            <div class="modal-body">
                <div class="login-tabs">
                    <button class="tab-btn active" data-tab="login">登录</button>
                    <button class="tab-btn" data-tab="register">注册</button>
                </div>
                
                <div class="tab-content" id="login-tab">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="login-username">用户名</label>
                            <input type="text" id="login-username" placeholder="请输入用户名" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">密码</label>
                            <input type="password" id="login-password" placeholder="请输入密码" required>
                        </div>
                        <div class="form-options">
                            <label><input type="checkbox"> 记住我</label>
                            <a href="#" class="forgot-password">忘记密码？</a>
                        </div>
                        <button type="submit" class="btn-submit">登录</button>
                    </form>
                </div>
                
                <div class="tab-content" id="register-tab" style="display:none;">
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="register-username">用户名</label>
                            <input type="text" id="register-username" placeholder="请设置用户名" required>
                        </div>
                        <div class="form-group">
                            <label for="register-password">密码</label>
                            <input type="password" id="register-password" placeholder="请设置密码" required>
                        </div>
                        <div class="form-group">
                            <label for="register-confirm-password">确认密码</label>
                            <input type="password" id="register-confirm-password" placeholder="请确认密码" required>
                        </div>
                        <button type="submit" class="btn-submit">注册</button>
                    </form>
                </div>
                
                <div class="tab-content" id="forgot-tab" style="display:none;">
                    <form id="forgotForm">
                        <div class="form-group">
                            <label for="forgot-username">用户名</label>
                            <input type="text" id="forgot-username" placeholder="请输入用户名" required>
                        </div>
                        <div class="form-group">
                            <label for="forgot-new-password">新密码</label>
                            <input type="password" id="forgot-new-password" placeholder="请设置新密码" required>
                        </div>
                        <div class="form-group">
                            <label for="forgot-confirm-password">确认新密码</label>
                            <input type="password" id="forgot-confirm-password" placeholder="请确认新密码" required>
                        </div>
                        <button type="submit" class="btn-submit">重置密码</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <main class="container">
        <!-- 首页大屏 + 全新大气书法标题 -->
        <section class="hero">
            <div class="hero-content">
                <h2>
                    <span class="red-text">红</span>
                    <span class="green-text">绿</span>
                    <span class="blend-text">交融</span>
                </h2>
                <p>景美人和 · 探寻休宁白际</p>
                <button class="btn-explore" id="exploreBtn"><i class="fas fa-map-signals"></i> 探索白际路线</button>
            </div>
        </section>

        <!-- 路线卡片区 -->
        <section id="routes-section">
            <div class="route-cards" id="routeCardContainer"></div>
        </section>

        <!-- 地图 + 侧边栏交互区 -->
        <section class="map-explore-section">
            <div class="map-wrapper">
                <div id="map"></div>
                <div class="route-sidebar" id="routeSidebar">
                    <h3>🌄 路线漫游</h3>
                    <div id="selectedInfo" class="selected-route-info">
                        <p>👆 点击上方路线卡片，加载专属地图</p>
                    </div>
                    <div id="popupPreview" class="popup-preview">
                        <strong>⛩️ 景点弹窗预览</strong>
                        <p style="margin-top: 6px;">点击地图标记查看详情</p>
                    </div>
                    <ul class="feature-list" id="pointHintList">
                        <li>标记会显示在此处</li>
                    </ul>
                </div>
            </div>
        </section>

        <!-- 特产模块 -->
        <section class="specialties-section" id="specialtyModule">
            <h2><i class="fas fa-basket-shopping"></i> 白际乡土风物</h2>
            <div class="specialty-scroll" id="specialtyScroll"></div>
        </section>
        
        <!-- 用户留言板 -->
        <section class="message-board-section">
            <h2><i class="fas fa-comments"></i> 用户留言板</h2>
            <div class="message-board">
                <div class="message-form">
                    <h3>留下您的足迹</h3>
                    <form id="messageForm">
                        <div class="form-group">
                            <label for="message-content">留言内容</label>
                            <textarea id="message-content" placeholder="分享您的白际之旅..." rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn-submit" id="submitMessageBtn">发布留言</button>
                    </form>
                </div>
                <div class="message-list" id="messageList">
                    <h3>留言列表</h3>
                    <div class="message-items" id="messageItems">
                        <!-- 留言将通过JavaScript动态添加 -->
                        <div class="message-item empty-message">
                            <p>暂无留言，快来发表第一条留言吧！</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 引入外部脚本文件 -->
    <script src="script.js"></script>
    
    <!-- 自动消失弹窗容器 -->
    <div id="autoAlertContainer" class="auto-alert-container"></div>
    
    <!-- AI客服模块 -->
    <div class="ai-customer-service">
        <div class="ai-customer-service-btn" id="aiServiceBtn">
            <i class="fas fa-headset"></i>
        </div>
        <div class="ai-customer-service-panel" id="aiServicePanel">
            <div class="ai-service-header">
                <h3>AI智能客服</h3>
                <button class="ai-service-close" id="aiServiceClose">&times;</button>
            </div>
            <div class="ai-service-messages" id="aiServiceMessages">
                <div class="ai-message">
                    <div class="message-content">
                        您好！我是白际乡旅游平台的AI客服，有什么可以帮您的吗？
                    </div>
                </div>
            </div>
            <div class="ai-service-input">
                <input type="text" id="aiServiceInput" placeholder="请输入您的问题...">
                <button id="aiServiceSend"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</body>
</html>
